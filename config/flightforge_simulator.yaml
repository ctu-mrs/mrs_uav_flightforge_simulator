mrs_uav_flightforge_simulator:

  # the rate of stepping the simulation
  simulation_rate: 100.0 # Hz

  # The ip address of the simulator. If running locally, set to "localhost". 
  simulator_ip: "localhost"

  # The game mode port of the simulator (drone ports are assigned by the simulator on spawn).
  simulator_port: 8551

  # the rate of publishing of /clock
  clock_rate:      400.0 # Hz, should be >= simulation_rate, ideally in whole multiples of simulation_rate

  realtime_factor: 1.0 # [-]

  dynamic_rtf: true

  collisions:
    enabled: true
    crash: true

    # if crash==false, then the collisions are elastic
    rebounce: 100.0

  # when true, the simulation time will get initialized from wall time
  sim_time_from_wall_time: true

  # Set mutual visibilitiy and collision of UAVs
  uavs_mutual_visibility: true

  #  0 - LOW
  #  1 - MEDIUM
  #  2 - HIGH
  #  4 - EPIC
  #  5 - CINEMATIC
  graphics_settings: "low"

  # 0 -  VALLEY
  # 1 -  FOREST (only in the full version)
  # 2 -  INFINITE_FOREST (only in the full version)
  # 3 -  WAREHOUSE
  # 4 -  CAVE
  # 5 -  ERDING_AIRBASE (only in the full version)
  # 6 -  TEMESVAR (only in the full version)
  world_name: "valley"

  #  {"sunny", 0},
  #  {"cloudy", 1},
  #  {"foggy", 2},
  #  {"rain", 3},
  #  {"rain_light", 4},
  #  {"rain_thunderstorm", 5},
  #  {"sand_dust_calm", 6},
  #  {"sand_dust_storm", 7},
  #  {"snow", 8},
  #  {"snow_blizzards", 9}
  weather_type: "cloudy"

  daytime:
    hour: 18
    minute: 25

  ############ Only Forest Procedural Generation settings ############

  # Choose cluttered difficulties from 1 [high] to 10 [low]
  ueds_forest_density: 6

  # Choose Hilly Level from 1 [totally flat] to 5 [the most hilly]
  ueds_forest_hilly_level: 3

  ####################################################################

  # Each type takes n_sensors instances; sensor_<i> overrides any key of the type's default block.
  # Topics are /<uav>/<type>_<i>/..., TF frames <uav>/<type>_<i>.
  sensors:

    rgb:
      n_sensors: 0
      default:
        rate: 30.0 # [Hz]
        width: 640 # [px]
        height: 480 # [px]
        fov: 120.0 # [deg]
        offset: {x: 0.14, y: 0.0, z: 0.0} # [m]
        rotation: {roll: 0.0, pitch: 0.0, yaw: 0.0} # [deg]
        enable_hdr: true
        enable_temporal_aa: true
        enable_raytracing: true
        enable_motion_blur: true
        motion_blur_amount: 0.5 # [0.0 - 1.0]
        motion_blur_distortion: 50.0 # [0-100]

    rgb_segmented:
      n_sensors: 0
      default: &camera_default
        rate: 5.0 # [Hz]
        width: 640 # [px]
        height: 480 # [px]
        fov: 120.0 # [deg]
        offset: {x: 0.14, y: 0.0, z: 0.0} # [m]
        rotation: {roll: 0.0, pitch: 0.0, yaw: 0.0} # [deg]
        enable_hdr: true
        enable_temporal_aa: true
        enable_raytracing: true
        enable_motion_blur: false
        motion_blur_amount: 0.5
        motion_blur_distortion: 50.0

    # 16UC1 in millimetres
    depth:
      n_sensors: 0
      default: *camera_default

    # 32SC1 instance ids, with the id -> actor map latched on .../labels
    instance_seg:
      n_sensors: 0
      default: *camera_default

    fisheye:
      n_sensors: 0
      default:
        rate: 10.0 # [Hz]
        width: 640 # [px]
        height: 640 # [px]
        fov: 180.0 # [deg]
        lens_model: 0 # 0 equidistant, 1 equisolid, 2 stereographic, 3 kannala-brandt
        full_frame: false
        offset: {x: 0.1, y: 0.0, z: 0.0} # [m]
        rotation: {roll: 0.0, pitch: 0.0, yaw: 0.0} # [deg]

    # the eyes sit at +-baseline/2 along y around offset
    stereo:
      n_sensors: 0
      default:
        rate: 10.0 # [Hz]
        width: 640 # [px]
        height: 480 # [px]
        fov: 90.0 # [deg]
        baseline: 0.075 # [m]
        offset: {x: 0.3, y: 0.0, z: 0.0} # [m]
        rotation: {roll: 0.0, pitch: 20.0, yaw: 0.0} # [deg]
        enable_hdr: true
        enable_temporal_aa: true
        enable_raytracing: true

    # event_camera_msgs/EventPacket, evt3
    event:
      n_sensors: 0
      default:
        rate: 100.0 # [Hz]
        width: 346 # [px]
        height: 260 # [px]
        fov: 90.0 # [deg]
        contrast_threshold_pos: 0.2
        contrast_threshold_neg: 0.2
        max_events_per_frame: 1048576
        offset: {x: 0.1, y: 0.0, z: 0.0} # [m]
        rotation: {roll: 0.0, pitch: 0.0, yaw: 0.0} # [deg]

    lidar:
      n_sensors: 0
      default:
        rate: 10.0 # [Hz]
        livox: false
        livox_sensor: "mid360" # "mid360" or "avia"
        intensity: false # adds the material class as "intensity"
        labels: false # adds "class_id" and "instance_id"
        publish_free: true # unit directions of rays without a return on .../points_free
        horizontal_rays: 128 # [-]
        vertical_rays: 64 # [-]
        horizontal_fov_left: 180.0 # [deg]
        horizontal_fov_right: 180.0 # [deg]
        vertical_fov_up: 45.0 # [deg]
        vertical_fov_down: 45.0 # [deg]
        beam_length: 20.0 # [m]
        offset: {x: 0.0, y: 0.0, z: 0.25} # [m]
        rotation: {roll: 0.0, pitch: 0.0, yaw: 0.0} # [deg]
        noise:
          enabled: true
          std_at_1m: 0.01 # [m]
          std_slope: 0.2 # [-] multiplies std_at_1m for each meter of measured distance

    # the simulator's rangefinder looks straight down from the airframe; the mount only places its TF frame
    rangefinder:
      n_sensors: 1
      default:
        rate: 10.0 # [Hz]
        offset: {x: 0.0, y: 0.0, z: 0.0} # [m]
        rotation: {roll: 0.0, pitch: 90.0, yaw: 0.0} # [deg]
      sensor_0: {}


# randomization of the initial conditions around the desired spawn point
randomization:

  enabled: false

  bounds:
    x: 15.0
    y: 15.0
    z: 15.0

# * when enabled, this will place a temporary patch of ground just under the spawn location
# * this patch will disappear after the total_thrust > 0.9*hover_thrust
individual_takeoff_platform:
  enabled: false

ground:
  enabled: true
  z: 0.0 # [m]

iterate_without_input: true

input_timeout: 1.0 # [s]

g: 9.81 # [ms^-2]

subscribers:

  # used for feedforward
  tracker_cmd:
    enabled: false

  position_cmd:
    enabled: false

  velocity_hdg_cmd:
    enabled: false

  velocity_hdg_rate_cmd:
    enabled: false

  acceleration_hdg_cmd:
    enabled: false

  acceleration_hdg_rate_cmd:
    enabled: false

  attitude_cmd:
    enabled: false

  attitude_rate_cmd:
    enabled: true

  control_group_cmd:
    enabled: false

  actuators_group_cmd:
    enabled: false

publishers:

  odometry:
    enabled: true

  rangefinder:
    enabled: true

  imu:
    enabled: true

frames:
  world:
    name: "simulator_origin"
    prefix_with_uav_name: false
  fcu:
    name: "fcu"
    publish_tf: false
  rangefinder:
    name: "garmin"
    publish_tf: true
