uav_names: [
  "uav1",
]

frames:
  fcu:
    publish_tf: false

uav1:

  frame: "x500"
  type: "x500"
  spawn:
    x: 0.0
    y: 0.0
    z: 0.0
    heading: -1.57

ground:
  enabled: false
  z: 0.0 # [m]

individual_takeoff_platform:
  enabled: true

mrs_uav_flightforge_simulator:

  custom_level: true

  collisions:
    enabled: false
    crash: false

  sensors:

    lidar:

      beam_length: 50.0 # [m]

      enabled: false
      horizontal_rays: 128 # [-]
      vertical_rays: 128 # [-]

      lidar_segmented:
        enabled: false
        rate: 10.0 # [Hz]

      lidar_intensity:
        enabled: false
        rate: 10.0 # [Hz]

    rgb:

      enabled: false

      width: 1280 # [px]
      height: 800 # [px]
      fov: 90.0 # [deg]

      rgb_segmented:
        enabled: false
        rate: 10.0 # [Hz]

      offset:
        x: 0.3 # [m]
        y: 0.0 # [m]
        z: 0.0 # [m]

      rotation:
        pitch: 0.0 # [deg]

      depth:
        enabled: false

    stereo:

      enabled: true

      rate: 30.0

      width: 640 # [px]
      height: 480 # [px]
      fov: 90.0 # [deg]

      # Left camera configuration
      left:
        offset_x: 0.3 # [m]
        offset_y: 0.3 # [m]
        offset_z: 0.0 # [m]

        rotation_pitch: 0.0 # [deg]
        rotation_yaw: 0.0 # [deg]
        rotation_roll: 0.0 # [deg]

      # Right camera configuration
      right:
        offset_x: 0.3 # [m]
        offset_y: 0.0 # [m]
        offset_z: 0.0 # [m]

        rotation_pitch: 0.0 # [deg]
        rotation_yaw: 0.0 # [deg]
        rotation_roll: 0.0 # [deg]

  graphics_settings: "low"

  realtime_factor: 1.0 # [-]
