uav_names: [
  "uav1",
]

frames:
  fcu:
    publish_tf: false

uav1:

  frame: "x500"
  type: "x500"
  spawn:
    x: 0.0
    y: 50.0
    z: 0.0
    heading: 0.0

ground:
  enabled: false
  z: 0.0 # [m]

individual_takeoff_platform:
  enabled: true

mrs_uav_flightforge_simulator:

  collisions:
    enabled: false
    crash: false

  sensors:

    lidar:

      beam_length: 50.0 # [m]

      enabled: true
      horizontal_rays: 128 # [-]
      vertical_rays: 128 # [-]

      lidar_segmented:
        enabled: false
        rate: 10.0 # [Hz]

      lidar_intensity:
        enabled: false
        rate: 10.0 # [Hz]

    rgb:

      enabled: true

      rate: 30

      enable_hdr: false
      enable_temporal_aa: false
      enable_raytracing: false

      enable_motion_blur: true
      motion_blur_amount: 0.5 # [0.0 - 1.0]
      motion_blur_distortion: 50 # [0-100]

      width: 1280 # [px]
      height: 800 # [px]
      fov: 60.0 # [deg]

      rgb_segmented:
        enabled: false
        rate: 10.0 # [Hz]

      offset:
        x: 0.3 # [m]
        y: 0.0 # [m]
        z: 0.0 # [m]

      rotation:
        pitch: 0.0 # [deg]

      depth:
        enabled: false

    stereo:
      enabled: false

      rate: 30.0 # [Hz]

      width: 640 # [px]
      height: 480 # [px]
      fov: 90.0 # [deg]

      # Left camera configuration
      left: 
        offset_x: 0.6 # [m]
        offset_y: 0.0375 # [m]
        offset_z: 0.0 # [m]

        # TODO which Tait-Bryan convention is it in?
        rotation_pitch: 40.0 # [deg]
        rotation_yaw: 0.0 # [deg]
        rotation_roll: 0.0 # [deg]

      # Right camera configuration
      right:
        offset_x: 0.6 # [m]
        offset_y: -0.0375 # [m]
        offset_z: 0.0 # [m]

        # TODO which Tait-Bryan convention is it in?
        rotation_pitch: 40.0 # [deg]
        rotation_yaw: 0.0 # [deg]
        rotation_roll: 0.0 # [deg]

      enable_hdr: true
      enable_temporal_aa: true
      enable_raytracing: true

  graphics_settings: "low"

  realtime_factor: 1.0 # [-]

  # world_name: "valley" # works in Lite
  # world_name: "warehouse" # works in Lite

  # TODO
  # world_name: "cave" # does not work
  # world_name: "dead_spruce_forest" # does not work
  # world_name: "infinite_forest" # does not work
  world_name: "temesvar" # does not work

  # weather_type: "cloudy"

  daytime:

    hour: 15
    minute: 30
